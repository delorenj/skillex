name: Node package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / Linux
    # Public repo: hosted runners are free, and this personal-account repo has no self-hosted runner
    # (org runners cannot see it), so a self-hosted label queued every run forever and Publish never fired.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # tests/node/usage.test.mjs validates the --usage-spec KDL with the real usage CLI.
      - name: Install the usage CLI
        run: |
          curl -fsSL https://github.com/jdx/usage/releases/download/v7.4.0/usage-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          install -m 755 "$(find "$RUNNER_TEMP" -type f -name usage | head -1)" /usr/local/bin/usage
          usage --version
      - run: npm ci
      - run: npm run check
