min_version: 1.7.0

# Fast checks on commit. Auto-fixes get re-staged.
# --force-exclude makes ruff honor pyproject.toml's extend-exclude even when
# files are passed explicitly, so vendored skills under .agents/, .claude/,
# all-skills/, packs/, etc. are never touched.
pre-commit:
  parallel: true
  jobs:
    - name: ruff-check
      glob: "*.py"
      run: uv run ruff check --force-exclude --fix {staged_files}
      stage_fixed: true
    - name: ruff-format
      glob: "*.py"
      run: uv run ruff format --force-exclude {staged_files}
      stage_fixed: true

# Slower, repo-wide checks on push. One serialized job: scripts/pre-push-checks.sh takes a
# per-checkout lock and runs node-check, ruff, mypy, pytest in order. Separate lefthook jobs
# cannot hold a lock across steps, and overlapping gates raced on the shared dist/.
pre-push:
  parallel: false
  jobs:
    - name: serialized-checks
      run: scripts/pre-push-checks.sh
