[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph-voyage-mcp"
version = "0.1.0"
description = "MCP server for the codegraph-voyage semantic retrieval sidecar"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "33GOD" }]
dependencies = ["mcp>=1.0,<2", "starlette>=0.27", "uvicorn>=0.23"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
codegraph-voyage-mcp = "codegraph_voyage_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
