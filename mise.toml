[tools]
lefthook = "latest"

[env]
_.file = [".env"]
_.path = [".mise/scripts", "agents/hermes/pm", "agents/hermes/pm/hermes"]

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
[[hooks.enter]]
script = "'{{config_root}}/.mise/scripts/materialize-env.sh'"
[[hooks.enter]]
script = "'{{config_root}}/.mise/scripts/link-agentfiles.sh'"
[[hooks.enter]]
script = "python3 '{{config_root}}/.mise/scripts/provision-packs.py'"
[[hooks.enter]]
script = "python3 '{{config_root}}/.mise/scripts/sync-skills.py' --scope project"

[tasks.install]
description = "Install dependencies with uv"
run = "uv sync"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check ."

[tasks.fmt]
description = "Format with ruff"
run = "uv run ruff format ."

[tasks.tc]
description = "Typecheck with mypy"
run = "uv run mypy src/skillex"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link-agentfiles"

[[watch_files]]
patterns = [".agents/skills.json"]
task = "skills-sync"

[tasks.link-agentfiles]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh'"

[tasks.skills-sync]
description = "Sync skills from manifest to local CLI dirs"
depends = ["skills-provision-packs"]
run = "python3 '{{config_root}}/.mise/scripts/sync-skills.py' --scope project"

[tasks.skills-provision-packs]
description = "Provision every Skillex pack declared in .agents/skills.json"
run = "python3 '{{config_root}}/.mise/scripts/provision-packs.py'"

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "'{{config_root}}/.mise/scripts/versioning.sh' current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "'{{config_root}}/.mise/scripts/versioning.sh' check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "'{{config_root}}/.mise/scripts/versioning.sh' sync"
# <<< mise-versioning <<<

[tasks.build]
description = "Build distribution"
run = "uv build"

[tasks.check]
description = "Run all quality checks: lint, typecheck, test"
depends = ["lint", "tc", "test"]

[tasks.setup]
description = "Install dependencies and git hooks"
run = ["uv sync", "lefthook install"]
