[tools]
lefthook = "latest"

[env]
_.file = [".env"]
# `.mise/scripts` is deliberately NOT on PATH. It still holds sync-skills.py and
# provision-packs.py -- kept as the reference implementation the migration was read
# against, and cited by paths.py, models.py, pack.py and environment.py -- but a
# retired projector that answers to its bare name is a loaded gun: `sync-skills.py
# --scope global` resolves zero skills against a sets-only manifest and then prunes
# every link skillex wrote, exiting 0. Nothing invokes any script here by bare name
# (every task uses an absolute '{{config_root}}/.mise/scripts/...' path, and the two
# scripts find each other via Path(__file__).resolve().parent), so this costs nothing.
_.path = ["agents/hermes/pm", "agents/hermes/pm/hermes"]

# This block will handle the linking of
# agent files to the main AGENTS.md file.
#
# TODO: Ensure this works for all levels of nesting.
# i.e. All linked agent files MUST be siblings at
# any given level of nesting.
[[hooks.enter]]
script = "'{{config_root}}/.mise/scripts/materialize-env.sh'"
[[hooks.enter]]
script = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"
# NOTE: there is deliberately no skills enter hook.
#
# Two used to live here (provision-packs.py, then sync-skills.py --scope project)
# and they rewrote .agents/skills on every `cd` into this repo. That made manual
# verification impossible -- you could not observe a projection you had just made,
# because entering the directory to look at it rebuilt it first -- and it meant a
# projector with no sets[] support ran unattended against a sets-only manifest.
# `skillex sync` is a command you run, not a thing that happens to you.

[tasks.install]
description = "Install dependencies with uv"
run = "uv sync"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check ."

[tasks.fmt]
description = "Format with ruff"
run = "uv run ruff format ."

[tasks.tc]
description = "Typecheck with mypy"
run = "uv run mypy src/skillex"

[[watch_files]]
patterns = ["AGENTS.md"]
task = "link:agentfiles"

[[watch_files]]
patterns = [".agents/skills.json"]
task = "skills:sync"

[tasks."link:agentfiles"]
description = "Symlink all agent files to AGENTS.md"
run = "'{{config_root}}/.mise/scripts/link-agentfiles.sh' '{{config_root}}'"

# --scope project, deliberately. [[watch_files]] fires this task whenever
# .agents/skills.json is saved, and `skillex sync` defaults to reconciling the
# GLOBAL root as well as the project one. A file-watch that silently rebuilds the
# machine-wide projection every time you edit a project manifest is not something
# you would ever ask for; it is also a behavior change from the engine this
# replaced, which was project-only. Run `skillex sync` yourself for both.
[tasks."skills:sync"]
description = "Reconcile this project's .agents/skills from its manifest"
run = "uv run skillex sync --scope project --project '{{config_root}}'"

[tasks."skills:sync:preview"]
description = "Show what a sync would change here, without changing it"
run = "uv run skillex sync --scope project --project '{{config_root}}' --dry-run"

# `skills:provision:packs` is gone with the engine that needed it. Pack members
# now resolve during `skillex sync` itself -- there is no separate provisioning
# step to forget, and nothing writes a projection except the reconciler.

# >>> mise-versioning >>>  (managed block — do not edit by hand; re-run init to update)
[tasks."version"]
description = "Print the current version (vX.Y.Z)"
run = "'{{config_root}}/.mise/scripts/versioning.sh' current"

[tasks."version:bump"]
description = "Bump patch version: vX.Y.Z -> vX.Y.(Z+1)"
alias = "version:bump-patch"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump patch"

[tasks."version:bump-minor"]
description = "Bump minor version: vX.Y.Z -> vX.(Y+1).0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump minor"

[tasks."version:bump-major"]
description = "Bump major version: vX.Y.Z -> v(X+1).0.0"
run = "'{{config_root}}/.mise/scripts/versioning.sh' bump major"

[tasks."version:check"]
description = "Verify every versioned file is in parity"
run = "'{{config_root}}/.mise/scripts/versioning.sh' check"

[tasks."version:sync"]
description = "Force every versioned file up to the highest version"
run = "'{{config_root}}/.mise/scripts/versioning.sh' sync"
# <<< mise-versioning <<<

[tasks.build]
description = "Build distribution"
run = "uv build"

[tasks.check]
description = "Run all quality checks: lint, typecheck, test"
depends = ["lint", "tc", "test"]

[tasks."topology:check"]
description = "Audit strict single-source ownership (expected red until migration completes)"
run = "uv run skillex topology check --root '{{config_root}}'"

[tasks.setup]
description = "Install dependencies and git hooks"
run = ["uv sync", "lefthook install"]

# PJAN-84: the GLOBAL projection — ~/.agents/skills.json into skill-sets/global,
# which every CLI on this machine reads through a single dir-level alias. It
# lives here, in the registry that owns the farm, and NOT in the CommonProject
# template: a project must never sync the machine's shared skill set, and there
# is deliberately no enter hook for it.
#
# Preview first. This projection is shared by every CLI and every project on the
# box, so see what a sync would remove before it removes anything.
[tasks."skills:sync:global:preview"]
description = "Report what a global skill sync would change, without changing it"
run = "uv run skillex sync --scope global --dry-run"

[tasks."skills:sync:global"]
description = "Reconcile ~/.agents/skills from ~/.agents/skills.json"
run = "uv run skillex sync --scope global"
